name: Build linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build app
        run: make ci-linux

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: when-my-meeting-linux-amd64
          path: dist/*.deb
