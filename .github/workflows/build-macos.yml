name: Build macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Install Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Build
        run: |
          fyne package \
            -os darwin \
            -icon internal/assets/icon.svg \
            -name "When My Meeting" \
            -app-id com.makaksel.when-my-meeting \
            -app-version 0.1.0 \
            -app-build 1
