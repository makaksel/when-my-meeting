name: Build macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Install Fyne CLI
        run: |
          go install fyne.io/tools/cmd/fyne@latest

      - name: Build app
        shell: bash
        run: make build-macos
