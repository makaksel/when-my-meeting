name: Build macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Install Fyne CLI
        run: |
          go install fyne.io/tools/cmd/fyne@latest

      - name: Build app
        shell: bash
        run: |
          set -euo pipefail

          cd cmd/when-my-meeting

          rm -rf "When My Meeting.app" dist

          fyne package \
            -os darwin \
            -icon ../../internal/assets/icon.png \
            -name "When My Meeting" \
            -app-id com.makaksel.when-my-meeting \
            -app-version 0.1.0 \
            -app-build 1

          echo "Adding LSUIElement..."

          /usr/libexec/PlistBuddy \
            -c "Add :LSUIElement bool true" \
            "When My Meeting.app/Contents/Info.plist"

          echo "Removing extended attributes..."

          xattr -cr "When My Meeting.app"

          echo "Ad-hoc signing..."

          codesign \
            --force \
            --sign - \
            "When My Meeting.app"

          echo "Verifying signature..."

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            "When My Meeting.app"

          echo "Checking Info.plist..."

          plutil -p \
            "When My Meeting.app/Contents/Info.plist"

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail

          cd cmd/when-my-meeting

          rm -rf dmg dist
          mkdir -p dmg dist

          # Copy the app into the DMG staging directory.
          ditto \
            "When My Meeting.app" \
            "dmg/When My Meeting.app"

          # Optional: Applications symlink for drag & drop installation.
          ln -s /Applications dmg/Applications

          # Create compressed DMG.
          hdiutil create \
            -volname "When My Meeting" \
            -srcfolder dmg \
            -format UDZO \
            -imagekey zlib-level=9 \
            -ov \
            "dist/When My Meeting.dmg"

      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail

          cd cmd/when-my-meeting

          echo "=== DMG ==="
          ls -lh dist/

          echo "=== App signature ==="
          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=4 \
            "dmg/When My Meeting.app"

          echo "=== DMG contents ==="
          hdiutil imageinfo "dist/When My Meeting.dmg" | head -30

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: when-my-meeting-macos
          path: cmd/when-my-meeting/dist/When My Meeting.dmg
