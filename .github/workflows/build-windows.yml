name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null

          go build -v `
            -ldflags="-H=windowsgui -s -w" `
            -o dist/package/when-my-meeting.exe `
            ./cmd/when-my-meeting

          Copy-Item `
            packaging/windows/icon.ico `
            dist/package/icon.ico

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: when-my-meeting-windows-amd64
          path: dist/package
