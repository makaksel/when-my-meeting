name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        shell: pwsh
        run: |
          make build-windows
          # New-Item -ItemType Directory -Force -Path dist/package | Out-Null

          # go build -v `
          #   -ldflags="-H=windowsgui -s -w" `
          #   -o dist/package/when-my-meeting.exe `
          #   ./cmd/when-my-meeting

          # Copy-Item `
          #   internal/assets/icon_windows.ico `
          #   dist/package/icon.ico

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: when-my-meeting-windows-amd64
          path: dist/package
