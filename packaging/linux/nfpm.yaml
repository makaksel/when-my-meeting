name: when-my-meeting
arch: amd64
platform: linux

version: 0.1.0
maintainer: "Alex Makarov"
description: "When My Meeting"
vendor: "makaksel"
homepage: "https://github.com/makaksel/when-my-meeting"

contents:
  - src: dist/when-my-meeting
    dst: /usr/bin/when-my-meeting
    file_info:
      mode: 0755

  - src: packaging/linux/com.makaksel.when-my-meeting.desktop
    dst: /usr/share/applications/com.makaksel.when-my-meeting.desktop
    file_info:
      mode: 0644

  - src: internal/assets/icon.png
    dst: /usr/share/icons/hicolor/256x256/apps/when-my-meeting.png
    file_info:
      mode: 0644
